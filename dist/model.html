<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モデル表示 - ポートフォリオ</title>
  <script defer src="javascripts/main.js"></script><link href="./stylesheets/main.css" rel="stylesheet"></head>
  <body class="modeling-page">
<header><a href="/">
    <h1>Portfolio Title</h1></a>
  <nav>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/3dmodeling.html">3D</a></li>
      <li><a href="/music.html">Music</a></li>
    </ul>
  </nav>
</header>
    <div class="page">
      <div class="main-content">
        <div class="model-section">
          <h1 class="page-title">【モデル】サンプルモデル</h1>
          <div class="viewer-toolbar">
            <button class="btn-small" type="button">モデル表示</button>
          </div>
          <div class="viewer">
            <!-- メインの3Dキャンバス（YouTube風の黒背景）-->
            <canvas id="canvas-3d"></canvas>
          </div>
          <div class="meta-row"><span class="stat">ポリゴン数:<span id="stat-polys">-</span></span><span class="stat">頂点数:<span id="stat-verts">-</span></span><span class="stat">メッシュ数:<span id="stat-meshes">-</span></span><span class="stat">マテリアル数:<span id="stat-mats">-</span></span></div>
          <div class="description">
            <h2>説明 / 情報</h2>
            <p>これは Three.js を用いたサンプルモデルの表示ページです。左の「モデル表示」ボタンからモデルを切り替えられます。</p>
            <ul class="info-list">
              <li>公開日:<span id="info-date">-</span></li>
              <li>制作ソフト:<span id="info-software">-</span></li>
              <li>ライセンス:<span id="info-license">-</span></li>
            </ul>
          </div>
        </div>
        <div class="sidebar">
          <div class="author-card">
            <div class="author-header"><img class="avatar" src="images/icon.png" alt="author">
              <div class="author-info">
                <h3 class="author-name">作者名</h3>
                <button class="follow-btn" type="button">フォロー</button>
              </div>
            </div>
          </div>
          <div class="related">
            <h3>関連モデル</h3>
            <div class="list" id="related-list"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
